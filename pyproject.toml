[project]
name = "german-media-learning"
version = "0.1.0"
description = "Learn German vocab and grammar from German series and films"
requires-python = ">=3.11"
dependencies = [
    "spacy>=3.8,<3.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
